<div class="form-container">
    <form #transactionForm="ngForm">
        <h2 style="display: flex;justify-content: center;">Add New Expense</h2>
        <p>Enter your expense details below</p>
        <div class="type-button">
            <button id="income-button" type="button" value='income' (click)="addIncome()">Income</button>
            <button id="expense-button" type="button" value='expense' (click)="addExpense()">Expense</button>
        </div>


        @if(value === 'expense') {
            <label>Expense Name</label>
            <input type="text" name="expenseName" [(ngModel)]="expenseName" #expense="ngModel" required placeholder="e.g. Shopping, Food">
            @if(expense.invalid && expense.touched){
                <small class="error">Expense name is required (minimum 2 characters).</small>
            }
        }

        <label>Amount (₹)</label>
        <input type="number" name="amount" [(ngModel)]="amount" #amt="ngModel"  placeholder="Enter amount" required min="0">
            @if(amt.invalid && amt.touched) {
            <small class="error">Enter an amount greater than 0.</small>
        }
        

        <label>Date</label>
        <input type="date" name="date" required [(ngModel)]="date">

        <button type="submit" (click)="addTransaction()" [disabled]="transactionForm.invalid">Submit Details</button>
        @if(successMessage){
            <p class="success">{{ successMessage }}</p>
        }
    </form>
</div>
